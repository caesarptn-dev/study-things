<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Metro ไทย</title>
<style>
:root{--bg:#f2f2f2;--fg:#111;--card:#fff;--mut:#666;--ln:#ccc;--a:#0078d7;--b:#e51400;--c:#60a917;--d:#f0a30a;--e:#8e24aa;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#fff;--card:#1f1f1f;--mut:#9a9a9a;--ln:#444}}
:root[data-theme="dark"]{--bg:#111;--fg:#fff;--card:#1f1f1f;--mut:#9a9a9a;--ln:#444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI","Leelawadee UI","Noto Sans Thai",Tahoma,Arial,sans-serif;font-weight:300}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:40px;font-weight:200;margin:8px 0 14px;letter-spacing:-1px}
h2{font-size:15px;font-weight:600;margin:18px 0 8px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.t{border:0;color:#fff;text-align:left;padding:12px;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;font:inherit;cursor:pointer}
.t:active{transform:scale(.97)}
.t.w{grid-column:span 2}
.t b{font-size:22px;font-weight:300}.t small{font-size:14px;opacity:.9}
.t .big{font-size:44px;font-weight:200;line-height:1.1}
.A{background:var(--a)}.B{background:var(--b)}.C{background:var(--c)}.D{background:var(--d)}.E{background:var(--e)}.K{background:#2d2d2d}
.v{display:none}.v.on{display:block}
.back{background:none;border:0;color:var(--a);font:inherit;font-size:16px;cursor:pointer;padding:4px 0}
input,select,textarea,button.p{font:inherit;font-size:16px;padding:10px;border:2px solid var(--ln);background:var(--card);color:var(--fg);border-radius:0;width:100%;margin:4px 0}
button.p{background:var(--a);color:#fff;border-color:var(--a);cursor:pointer;width:auto;padding:10px 18px}
button.p.g{background:transparent;color:var(--fg);border-color:var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}
.it{background:var(--card);border-left:6px solid var(--a);padding:10px 12px;margin:6px 0;display:flex;justify-content:space-between;gap:8px;align-items:center}
.it.done{opacity:.5;text-decoration:line-through}.it small{color:var(--mut);display:block}
.it button{background:none;border:0;color:var(--mut);font:inherit;cursor:pointer;padding:6px}
.tm{font-size:80px;font-weight:200;text-align:center;margin:10px 0;font-variant-numeric:tabular-nums}
#cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
#cg b,#cg i{text-align:center;font-size:13px;color:var(--mut);font-weight:600}
#cg button{aspect-ratio:1;border:0;background:var(--card);color:var(--fg);font:inherit;font-size:16px;cursor:pointer;position:relative}
#cg .today{outline:2px solid var(--a)}#cg .sel{background:var(--a);color:#fff}
#cg .imp::after{content:"";position:absolute;right:4px;top:4px;width:8px;height:8px;background:var(--b)}
.nav{display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.nav button{background:var(--card);border:0;color:var(--fg);font-size:22px;width:44px;height:44px;cursor:pointer}
#toast{position:sticky;top:0;background:var(--b);color:#fff;padding:12px;margin-bottom:8px;cursor:pointer;z-index:5}
.note{font-size:13px;color:var(--mut);margin-top:10px}
</style></head><body><main>
<div id="toast" hidden></div>
<h1>เรียน</h1>

<section class="v on" id="home">
 <div class="grid">
  <div class="t K w"><small id="hd"></small><span class="big" id="hc"></span></div>
  <button class="t A" data-go="timer"><b>ตั้งเวลา</b><span class="big" id="hT">25:00</span></button>
  <button class="t B" data-go="rem"><b>เตือนความจำ</b><small id="hN">ไม่มี</small></button>
  <button class="t C" data-go="log"><b>บันทึกประจำวัน</b><small id="hL">วันนี้ 0 นาที</small></button>
  <button class="t D" data-go="cal"><b>ปฏิทิน</b><small id="hD">ไม่มีกิจกรรม</small></button>
  <button class="t E w" id="perm"><b>เปิดการแจ้งเตือน</b><small id="ps"></small></button>
 </div>
 <p class="note">ข้อมูลบันทึกไว้ในเครื่องนี้ การแจ้งเตือนทำงานเมื่อเปิดหน้านี้ไว้ (เปิดเป็นแท็บเบื้องหลังได้) หากปิดหน้าเว็บทั้งหมดจะไม่มีการแจ้งเตือน</p>
</section>

<section class="v" id="timer"><button class="back" data-go="home">← กลับ</button>
 <h2>จับเวลาอ่านหนังสือ</h2>
 <div class="row"><select id="ts"></select><input id="tmin" type="number" min="1" value="25" aria-label="นาที"></div>
 <div class="tm" id="tt">25:00</div>
 <div class="row"><button class="p" id="tgo">เริ่ม</button><button class="p g" id="trs">รีเซ็ต</button></div>
</section>

<section class="v" id="rem"><button class="back" data-go="home">← กลับ</button>
 <h2>เพิ่มการเตือน</h2>
 <select id="rs"></select>
 <input id="rt" type="datetime-local">
 <input id="rd" placeholder="รายละเอียด (เช่น ทำแบบฝึกหัดบทที่ 5)">
 <button class="p" id="radd">เพิ่ม</button>
 <h2>รายการที่จะถึง</h2><div id="rl"></div>
</section>

<section class="v" id="log"><button class="back" data-go="home">← กลับ</button>
 <h2>วันนี้ทำอะไรบ้าง</h2>
 <input id="ld" type="date">
 <textarea id="lt" rows="4" placeholder="วันนี้ฉันเรียน…"></textarea>
 <button class="p" id="ladd">บันทึก</button>
 <h2>ประวัติ</h2><div id="ll"></div>
</section>

<section class="v" id="cal"><button class="back" data-go="home">← กลับ</button>
 <div class="nav"><button id="cp">‹</button><b id="cmt" style="font-size:22px;font-weight:300"></b><button id="cn">›</button></div>
 <div id="cg"></div>
 <h2 id="sdh"></h2>
 <div class="row"><input id="ct" placeholder="วันสำคัญ (สอบ, กำหนดส่งงาน…)"><button class="p" id="cadd" style="flex:0 0 auto">เพิ่ม</button></div>
 <div id="cl"></div>
</section>
</main>
<script>
const SUBJ=["คณิตศาสตร์","วิทยาศาสตร์","ภาษาอังกฤษ","ภาษาไทย","สังคม/ประวัติศาสตร์","ฟิสิกส์","เคมี","ชีววิทยา","เขียนโปรแกรม","อื่น ๆ"];
let S={rem:[],log:[],days:[],ses:[],t:{run:false,end:0,left:1500000,subj:SUBJ[0],min:25}};
try{const x=JSON.parse(localStorage.getItem("sm_th")||"{}");S=Object.assign(S,x)}catch(e){}
const save=()=>{try{localStorage.setItem("sm_th",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0");
const ds=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>ds(new Date());
const TH="th-TH";
let sel=today(),cm=new Date();

document.querySelectorAll("select").forEach(s=>s.innerHTML=SUBJ.map(x=>`<option>${x}</option>`).join(""));
function go(id){document.querySelectorAll(".v").forEach(v=>v.classList.toggle("on",v.id===id));if(id==="cal")cal();window.scrollTo(0,0);draw()}
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g)go(g.dataset.go)});

function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function notify(t,b){beep();try{if("Notification"in window&&Notification.permission==="granted")new Notification(t,{body:b})}catch(e){}
 const x=$("toast");x.textContent=t+" — "+b+" (แตะเพื่อปิด)";x.hidden=false}
$("toast").onclick=()=>$("toast").hidden=true;
function permState(){const m={granted:"เปิดอยู่",denied:"ถูกบล็อก",default:"แตะเพื่อเปิด"};$("ps").textContent=("Notification"in window)?m[Notification.permission]:"ไม่รองรับ"}
const ask=()=>{try{if(Notification.permission==="default")Notification.requestPermission().then(permState);else if(Notification.permission==="denied")notify("การแจ้งเตือนถูกบล็อก","เปิดอนุญาตได้ที่การตั้งค่าเว็บไซต์ของเบราว์เซอร์")}catch(e){}};
$("perm").onclick=ask;permState();
try{if(Notification.permission==="default")document.addEventListener("pointerdown",()=>{if(Notification.permission==="default")Notification.requestPermission().then(permState)},{once:true})}catch(e){}

/* timer */
function tdraw(){const T=S.t,l=T.run?Math.max(0,T.end-Date.now()):T.left,s=Math.ceil(l/1000),m=pad(Math.floor(s/60))+":"+pad(s%60);$("tt").textContent=m;$("hT").textContent=m;$("tgo").textContent=T.run?"หยุดชั่วคราว":"เริ่ม"}
$("tgo").onclick=()=>{const T=S.t;
 if(T.run){T.left=Math.max(0,T.end-Date.now());T.run=false}
 else{if(T.left<=0||!T.started){T.min=Math.max(1,+$("tmin").value||25);T.left=T.min*60000;T.subj=$("ts").value}T.started=true;T.end=Date.now()+T.left;T.run=true;try{Notification.permission==="default"&&Notification.requestPermission().then(permState)}catch(e){}}
 save();tdraw()};
$("trs").onclick=()=>{const m=Math.max(1,+$("tmin").value||25);S.t={run:false,end:0,left:m*60000,subj:$("ts").value,min:m,started:false};save();tdraw()};
$("tmin").oninput=()=>{if(!S.t.run&&!S.t.started){S.t.left=Math.max(1,+$("tmin").value||25)*60000;tdraw()}};

/* reminders */
$("rt").value=(()=>{const d=new Date(Date.now()+36e5);return ds(d)+"T"+pad(d.getHours())+":00"})();
$("radd").onclick=()=>{const v=$("rt").value;if(!v)return;S.rem.push({id:Date.now(),s:$("rs").value,at:new Date(v).getTime(),d:$("rd").value.trim(),done:false,fired:false});$("rd").value="";save();draw()};
function fmt(t){return new Date(t).toLocaleString(TH,{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}
function rdraw(){const L=[...S.rem].sort((a,b)=>a.at-b.at);$("rl").innerHTML=L.map(r=>`<div class="it ${r.done?"done":""}" style="border-color:var(--b)"><div><b>${esc(r.s)}</b> · ${fmt(r.at)}${r.d?`<small>${esc(r.d)}</small>`:""}</div><div><button data-rd="${r.id}">✓</button><button data-rx="${r.id}">✕</button></div></div>`).join("")||'<p class="note">ยังไม่มีการเตือน</p>';
 const n=L.find(r=>!r.done&&r.at>Date.now());$("hN").textContent=n?n.s+" · "+fmt(n.at):"ไม่มี"}
$("rl").onclick=e=>{const d=e.target.dataset;if(d.rd){const r=S.rem.find(x=>x.id==d.rd);r.done=!r.done}if(d.rx)S.rem=S.rem.filter(x=>x.id!=d.rx);save();draw()};

/* log */
$("ld").value=today();
$("ladd").onclick=()=>{const t=$("lt").value.trim();if(!t)return;S.log.push({id:Date.now(),d:$("ld").value||today(),t});$("lt").value="";save();draw()};
function ldraw(){const m=S.ses.filter(x=>x.d===today()).reduce((a,x)=>a+x.m,0);$("hL").textContent="วันนี้ "+m+" นาที";
 const ses=S.ses.slice().reverse().slice(0,5).map(x=>`<div class="it" style="border-color:var(--c)"><div><b>${esc(x.subj)}</b> · ${x.m} นาที<small>${x.d}</small></div></div>`).join("");
 $("ll").innerHTML=S.log.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(l=>`<div class="it" style="border-color:var(--c)"><div><b>${l.d}</b><small style="white-space:pre-wrap">${esc(l.t)}</small></div><button data-lx="${l.id}">✕</button></div>`).join("")+(ses?"<h2>รอบจับเวลา</h2>"+ses:"")||'<p class="note">ยังไม่มีบันทึก</p>'}
$("ll").onclick=e=>{const i=e.target.dataset.lx;if(i){S.log=S.log.filter(x=>x.id!=i);save();draw()}};

/* calendar */
$("cp").onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()-1,1);cal()};
$("cn").onclick=()=>{cm=new Date(cm.getFullYear(),cm.getMonth()+1,1);cal()};
function cal(){const y=cm.getFullYear(),m=cm.getMonth();$("cmt").textContent=cm.toLocaleString(TH,{month:"long",year:"numeric"});
 let h=["อา","จ","อ","พ","พฤ","ศ","ส"].map(x=>`<b>${x}</b>`).join("");
 for(let i=0;i<new Date(y,m,1).getDay();i++)h+="<i></i>";
 for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const k=ds(new Date(y,m,d));h+=`<button data-d="${k}" class="${k===today()?"today ":""}${k===sel?"sel ":""}${S.days.some(x=>x.d===k)?"imp":""}">${d}</button>`}
 $("cg").innerHTML=h;$("sdh").textContent=new Date(sel+"T00:00").toLocaleDateString(TH,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const L=S.days.filter(x=>x.d===sel);
 $("cl").innerHTML=L.map(x=>`<div class="it" style="border-color:var(--d)"><b>${esc(x.t)}</b><button data-cx="${x.id}">✕</button></div>`).join("");
 hd()}
function hd(){const up=S.days.filter(x=>x.d>=today()).sort((a,b)=>a.d.localeCompare(b.d))[0];$("hD").textContent=up?new Date(up.d+"T00:00").toLocaleDateString(TH,{day:"numeric",month:"short"})+" · "+up.t:"ไม่มีกิจกรรม"}
$("cg").onclick=e=>{if(e.target.dataset.d){sel=e.target.dataset.d;cal()}};
$("cadd").onclick=()=>{const t=$("ct").value.trim();if(!t)return;S.days.push({id:Date.now(),d:sel,t,n:false});$("ct").value="";save();cal()};
$("cl").onclick=e=>{const i=e.target.dataset.cx;if(i){S.days=S.days.filter(x=>x.id!=i);save();cal()}};

function draw(){rdraw();ldraw();tdraw();hd()}

/* tick */
function tick(){const n=new Date();$("hc").textContent=pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());
 $("hd").textContent=n.toLocaleDateString(TH,{weekday:"long",day:"numeric",month:"long",year:"numeric"});
 const T=S.t;if(T.run&&Date.now()>=T.end){T.run=false;T.left=0;T.started=false;S.ses.push({d:today(),subj:T.subj,m:T.min});save();notify("หมดเวลา",T.subj+" · "+T.min+" นาที");draw()}
 let ch=false;S.rem.forEach(r=>{if(!r.done&&!r.fired&&r.at<=Date.now()){r.fired=true;ch=true;notify("ถึงเวลาเรียน: "+r.s,r.d||"ได้เวลาอ่านหนังสือแล้ว")}});
 S.days.forEach(x=>{if(!x.n&&x.d===today()){x.n=true;ch=true;notify("วันสำคัญวันนี้",x.t)}});
 if(ch){save();draw()}else if(T.run)tdraw()}
draw();tick();setInterval(tick,1000);
</script></body></html>
